# Content Generator settings
# Edit values here to tune output without touching code.

video:
  width: 1080
  height: 1920
  fps: 30
  duration_seconds: 10      # length of the rendered reel
  background_dir: assets/backgrounds
  default_background: tennis_loop_01.mp4   # filename inside background_dir

text:
  # Style: one rounded white box per headline, black text inside, stacked top-to-bottom,
  # left-aligned, boxes sized to their own text (not full-width) so the clip shows through.
  font_dir: assets/fonts
  font_file: ArchivoBlack-Regular.ttf
  headline_font_size: 32
  line_height_multiplier: 1.15
  max_text_width_px: 560      # max headline text width inside a box (narrower so the clip stays visible on the right)
  fill_color: [212, 175, 55, 255]         # Tennis Lab gold text
  box_fill_color: [13, 27, 51, 235]       # Tennis Lab navy box background
  box_border_color: [212, 175, 55, 255]   # gold border, matches the logo ring
  box_border_width: 3
  box_radius_px: 18
  box_padding_x: 22
  box_padding_y: 13
  box_gap_px: 28              # vertical gap between headline boxes
  safe_bottom_px: 1700
  margin_left_px: 36
  title_text:
    en: "Tennis news you've probably missed today"
    hu: "Tenisz hírek, amikről valószínűleg lemaradtál"
  title_font_size: 40
  title_top_px: 170           # title box is centered horizontally, still near the top but lower than before
  title_max_width_px: 860     # wider than headlines since it's a single centered banner
  title_headline_gap_px: 90   # extra space between the title box and the first headline box

weather:
  api_base_url: "https://api.openweathermap.org/data/2.5"
  units: metric
  thresholds:
    heavy_rain_pop: 0.6          # probability of precipitation (0-1)
    heavy_rain_mm_3h: 4.0
    high_wind_kmh: 30.0
    high_wind_gust_kmh: 45.0
    extreme_heat_c: 35.0
    extreme_cold_c: 5.0

news:
  sources:
    - "https://www.atptour.com/en/news"
    - "https://www.wtatennis.com/news"
    - "https://www.tennis.com/news/"
    - "https://www.eurosport.com/tennis/"
  max_headlines: 6
  dedup_lookback_days: 5

paths:
  news_history: data/news_history.json
  weather_anomaly_log: data/weather_anomaly_log.json
  tournaments_today: data/tournaments_today.json
  drafts_dir: output/drafts
  videos_dir: output/videos

publishing:
  # Public repo used purely to give the Meta Graph API a fetchable HTTPS URL for the video
  # (it can't accept direct file uploads). Path is relative to this project's parent folder.
  media_repo_path: ../contentmedia
  media_repo_raw_base: "https://raw.githubusercontent.com/ujvariroland/contentmedia/main"
  graph_api_version: v21.0
  # Both accounts publish via a Facebook Page's linked Instagram Business Account
  # (env vars: META_<LANG>_PAGE_ID, META_<LANG>_IG_BUSINESS_ACCOUNT_ID, META_<LANG>_PAGE_ACCESS_TOKEN)
  accounts: [en, hu]
  # Which languages also get a Facebook Page video post (in addition to the Instagram Reel)
  facebook_post_languages: [hu]
